description: >-
  Bumble Inc. (NASDAQ: BMBL) is a global social-connection company that
  operates a portfolio of consumer relationship apps including Bumble Date
  (women-message-first dating), Bumble BFF (friendship matching), Bumble Bizz
  (professional networking), Badoo (dating, international), and Fruitz (Gen-Z
  dating, acquired 2022). The company is publicly traded and runs investor
  relations, careers, and trust/safety operations at scale. Bumble is a
  primarily consumer mobile and web product surface; no public developer or
  partner API has been identified. This entry catalogs the company surface
  for the API Evangelist index.
